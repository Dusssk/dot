# General
set -ga terminal-overrides ",:RGB"
set -g mouse on
set -g set-clipboard on

# Enable true color (24-bit color) support
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",*:RGB"

# Prefix
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix
unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind-key K confirm-before -p "Kill tmux server? (y/n)" kill-server

# Predetermined Windows
bind-key N new-window -c ~/.config/nvim -n 'nvim' \; send-keys 'nvim init.lua' Enter
bind-key T new-window -c ~/.config/tmux -n 'tmux' \; send-keys 'nvim tmux.conf' Enter
bind-key P new-window -c /mnt/sda2/programming -n 'code' \; send-keys 'nvim .' Enter
bind-key O new-window -c /mnt/sda2/programming -n 'code'
bind-key Y new-window -n 'youtube' \; send-keys 'youtube-tui' Enter

# Remove tmux's own background
set-option -g status-style 'bg=default'
set-option -g window-active-style 'bg=default'
set-option -g window-style 'bg=default'
set-option -g pane-active-border-style 'bg=default'
set-option -g pane-border-style 'bg=default'
set-option -g message-style 'bg=default'
set-option -g mode-style 'bg=default'

# Windows
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Swap window left and follow it
bind-key -r '<' run-shell 'tmux swap-window -t -1 \; select-window -t -1'
# Swap window right and follow it
bind-key -r '>' run-shell 'tmux swap-window -t +1 \; select-window -t +1'

# Windows navigation
unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim copy
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

