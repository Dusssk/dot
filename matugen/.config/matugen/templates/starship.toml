format = """
[╭── $directory](color8)\
[$git_branch](color9)$git_status\
$fill\
$c\
$python\
$lua\
$cmake\
$make\
$docker_context\
$container\
$jobs\
$cmd_duration\
$line_break\
[╰──$character](color8)\
"""

palette = "colors"

[palettes.colors]
color1 = '{{colors.primary_fixed_dim.default.hex}}'
color2 = '{{colors.on_primary.default.hex}}'
color3 = '{{colors.on_surface_variant.default.hex}}'
color4 = '{{colors.surface_container.default.hex}}'
color5 = '{{colors.on_primary.default.hex}}'
color6 = '{{colors.surface_dim.default.hex}}'
color7 = '{{colors.surface.default.hex}}'
color8 = '{{colors.primary.default.hex}}'
color9 = '{{colors.tertiary.default.hex}}'

[fill]
symbol = " "

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[directory]
style = "color1"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = false

[character]
format = "$symbol "
success_symbol = "[❯](color8)"
error_symbol = "[✗](color2)"

[git_branch]
style = "color9"


[git_status]
style = "color9"



