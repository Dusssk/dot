exec-once = hyprpaper
exec-once = hyprsunset
exec-once = goxlr-launcher
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store

$mainMod = SUPER
$shiftMod = SUPER SHIFT
$altMod = SUPER ALT
$terminal = kitty
$fileManager = thunar
$menu = rofi -show drun

source = colors.conf

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
# bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, M, exec, ~/.config/rofi/launchers/powermenu.sh
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, R, exec, $menu

bind = $shiftMod, S, exec, hyprshot -m region --clipboard-only

# bind = $shiftMod, E, exec, hyprshutdown --post-cmd "shutdown -h now"
# bind = $shiftMod, R, exec, hyprshutdown --post-cmd "reboot"

# Window
bind = $mainMod, Y, exec, hyprctl dispatch togglefloating && hyprctl dispatch centerwindow
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

unbind = SUPER, J
unbind = SUPER, K

# vim navigation
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $shiftMod, h, movewindow, l
bind = $shiftMod, j, movewindow, d
bind = $shiftMod, k, movewindow, u
bind = $shiftMod, l, movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $shiftMod, 1, movetoworkspace, 1
bind = $shiftMod, 2, movetoworkspace, 2
bind = $shiftMod, 3, movetoworkspace, 3
bind = $shiftMod, 4, movetoworkspace, 4
bind = $shiftMod, 5, movetoworkspace, 5
bind = $shiftMod, 6, movetoworkspace, 6
bind = $shiftMod, 7, movetoworkspace, 7
bind = $shiftMod, 8, movetoworkspace, 8
bind = $shiftMod, 9, movetoworkspace, 9

bind = $altMod, 1, movetoworkspacesilent, 1
bind = $altMod, 2, movetoworkspacesilent, 2
bind = $altMod, 3, movetoworkspacesilent, 3
bind = $altMod, 4, movetoworkspacesilent, 4
bind = $altMod, 5, movetoworkspacesilent, 5
bind = $altMod, 6, movetoworkspacesilent, 6
bind = $altMod, 7, movetoworkspacesilent, 7
bind = $altMod, 8, movetoworkspacesilent, 8
bind = $altMod, 9, movetoworkspacesilent, 9

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1


# Monitors
monitor=HDMI-A-2,1920x1080@60,0x0,1
monitor=HDMI-A-1,1920x1080@60,auto,1

# Cursor
env = XCURSOR_THEME,Bibata-Modern-Classic
env = XCURSOR_SIZE,24

general {
  gaps_in = 2
  gaps_out = 11
  border_size = 2
  col.inactive_border = $background
  col.active_border = $inverse_primary
}

misc {
  font_family = FiraCode Nerd Font
}

decoration {
  rounding = 4
}

input:tablet {
  output = HDMI-A-1
}

input{
	kb_layout = se
	kb_options =
	follow_mouse = 1
	touchpad {
		natural_scroll = no
	}
	sensitivity = 0
}

dwindle {
	preserve_split = true
	force_split = 2
}

