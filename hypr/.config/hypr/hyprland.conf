# This config is a STUB! This should never be generated.
# Use the default lua config from https://github.com/hyprwm/Hyprland/blob/main/example/hyprland.lua

exec-once = sleep 3 && wlr-randr --output Unknown-1 --custom-mode 1920x1080@60Hz --pos 0,0 && wlr-randr --output HDMI-A-1 --mode 1920x1080@60Hz --pos 1920,0

$mainMod = SUPER
$shiftMod = SUPER SHIFT
$terminal = kitty
$fileManager = thunar
$menu = fuzzel

bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, O, togglefloating,
bind = $mainMod, R, exec, $menu

unbind = SUPER, J
unbind = SUPER, K

# vim navigation
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

bind = $shiftMod, h, movewindow, l
bind = $shiftMod, j, movewindow, d
bind = $shiftMod, k, movewindow, u
bind = $shiftMod, l, movewindow, r

bind = $mainMod, s, layoutmsg, preselect r
bind = $mainMod, v, layoutmsg, preselect d


# Monitors
# monitor=,prefer,auto,1
monitor=HDMI-A-2,1920x1080@60,0x0,1
monitor=HDMI-A-1,1920x1080@144,auto,1,vrr,1

# Misc
env = GDK_DPI_SCALE,1
env = QT_ONT_DPI,96


misc {
  font_family = FiraCode Nerd Font
}

decoration {
  rounding = 4
}

input{
	kb_layout = se
	kb_options =
	follow_mouse = 1
	touchpad {
		natural_scroll = no
	}
	sensitivity = 0
}

dwindle {
	preserve_split = true
	force_split = 2
}
