format = """
[╭── $directory](color8)\
[$git_branch](color9)$git_status\
$fill\
$c\
$python\
$lua\
$cmake\
$make\
$docker_context\
$container\
$jobs\
$cmd_duration\
$line_break\
[╰──$character](color8)\
"""

palette = "colors"

[palettes.colors]
color1 = '#b8c4ff'
color2 = '#1f2d61'
color3 = '#c6c5d0'
color4 = '#1f1f25'
color5 = '#1f2d61'
color6 = '#121318'
color7 = '#121318'
color8 = '#b8c4ff'
color9 = '#e4bad9'

[fill]
symbol = " "

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[directory]
style = "color1"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = false

[character]
format = "$symbol "
success_symbol = "[❯](color8)"
error_symbol = "[✗](color2)"

[git_branch]
style = "color9"


[git_status]
style = "color9"



