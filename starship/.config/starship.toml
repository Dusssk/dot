format = """
[╭── $directory](blue)\
[$git_branch $git_status](blue)\
$fill\
$c\
$python\
$lua\
$cmake\
$make\
$docker_context\
$container\
$jobs\
$cmd_duration\
$line_break\
[╰──$character](blue)\
"""

[fill]
symbol = " "

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '
'Home' = 'U+1F3E0'

[directory]
style = "bold fg:dark blue"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = ".../"
truncate_to_repo = false

[character]
format = ">"

